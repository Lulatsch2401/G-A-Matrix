<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix GUT & AUSSEHEND</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const words = ['GUT', 'AUSSEHEND'];
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ0123456789@#$%^&*()'.split('');
        let currentWordIndex = 0;

        // 👉 HIER DEINE BILDER EINTRAGEN
        const images = [
            'img/Becker.JPG',
        ];

        let flyingImage = null;
        const maxInterval = 5 * 60 * 1000; // 5 Minuten

        function spawnImage() {
            const img = new Image();
            img.src = images[Math.floor(Math.random() * images.length)];

            flyingImage = {
                img: img,
                x: -200,
                y: Math.random() * (canvas.height - 200),
                size: 150 + Math.random() * 100,
                speed: 2 + Math.random() * 4
            };
        }

        function scheduleNextSpawn() {
            const nextTime = Math.random() * maxInterval;

            setTimeout(() => {
                spawnImage();
                scheduleNextSpawn();
            }, nextTime);
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;

                if (Math.random() > 0.98) {
                    const word = words[currentWordIndex % words.length];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    ctx.font = `${fontSize * 1.2}px monospace`;
                    ctx.fillText(word, x, y);
                    ctx.font = `${fontSize}px monospace`;

                    currentWordIndex++;
                }
            }

            // 👉 Bild zeichnen
            if (flyingImage && flyingImage.img.complete) {
                ctx.drawImage(
                    flyingImage.img,
                    flyingImage.x,
                    flyingImage.y,
                    flyingImage.size,
                    flyingImage.size
                );

                flyingImage.x += flyingImage.speed;

                // Bild entfernen wenn außerhalb
                if (flyingImage.x > canvas.width + flyingImage.size) {
                    flyingImage = null;
                }
            }
        }

        // 👉 Sofort beim Start (Debug)
        spawnImage();

        // 👉 Weitere zufällige Spawns
        scheduleNextSpawn();

        setInterval(draw, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
